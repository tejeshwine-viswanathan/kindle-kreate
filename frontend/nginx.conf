server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
